name: Shared Publishing Actions

description: Publish a package based on the package directory.
inputs:
  package_path:
    description: 'Path to the workspace to publish. Relative to the repository root'
    required: true

runs:
  using: composite
  steps:
    - name: Install Dart
      uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      with:
        sdk: '3.7.2'

    - name: Install Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        flutter-version: '3.29.3'
        channel: 'stable'

    - name: Install Dependencies
      shell: bash
      working-directory: ${{ inputs.package_path }}
      run: flutter pub get

    - name: Publish Package
      shell: bash
      working-directory: ${{ inputs.package_path }}
      run: flutter pub publish --force